services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lead_scraper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  automation-server:
    build:
      context: ./automation-server
      dockerfile: Dockerfile
    depends_on:
      - db
    ports:
      - "8000:8000"
      - "6080:6080"
    volumes:
      - ./automation-server:/app
      - /app/.venv
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=lead_scraper
      # Must match web-portal's ADMIN_SECRET below — change both together.
      - ADMIN_SECRET=change-me-in-production
      # VNC password for the noVNC live-view (port 6080). Change before exposing this beyond your own machine.
      - VNC_PASSWORD=change-me-in-production

  web-portal:
    build:
      context: ./web-portal
      dockerfile: Dockerfile
    depends_on:
      - automation-server
    ports:
      - "3000:3000"
    volumes:
      - ./web-portal:/app
      - /app/node_modules
      - /app/.next
    environment:
      - AUTOMATION_API_URL=http://automation-server:8000
      # Must match automation-server's ADMIN_SECRET above — change both together.
      - ADMIN_SECRET=change-me-in-production
      # Browser-facing URL for the noVNC live-view page (port 6080 on automation-server, exposed to the host).
      - NEXT_PUBLIC_VNC_URL=http://localhost:6080/vnc.html

volumes:
  postgres_data:
